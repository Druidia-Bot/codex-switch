[package]
name = "codex-switch"
version = "0.1.0"
edition = "2021"
description = "Toggle Codex CLI between OpenAI and Featherless (or any OpenAI-compatible provider)"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
